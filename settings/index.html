<!DOCTYPE html>
<html>
<head>
    <!-- The '/homey.js' script must be included in your settings view to work -->
    <script
            type="text/javascript"
            src="/homey.js"
            data-origin="settings"
    ></script>
    <style>
        #local-logs {
          max-height: 480px;
          overflow: auto;
          white-space: pre-wrap;
          word-break: break-word;
        }
    </style>
</head>
<body>

<header class="homey-header">
    <img src="../assets/images/vaillant-logo.png" alt="Vaillant"
         style="width: 100%; max-width: 200px; margin: 0 auto; display: block;">
</header>

<div class="homey-form-group">
  <h1 class="homey-title">Local logs</h1>
    <ul class="homey-subtitle">
        <li>App events and errors</li>
        <li>API calls to Vaillant</li>
    </ul>
  <pre id="local-logs">Loading logs...</pre>
</div>

<script type="text/javascript">
  function onHomeyReady(Homey) {
    Homey.ready();

    Homey.get('localLogs', function(err, localLogs) {
      showLocalLogs(err ? [] : localLogs);
    });
  }

  function showLocalLogs(localLogs) {
    var localLogsElement = document.getElementById('local-logs');
    var logs = Array.isArray(localLogs) ? localLogs : [];

    logs.sort(function(firstLog, secondLog) {
      return new Date(secondLog.timestamp) - new Date(firstLog.timestamp);
    });

    if (logs.length === 0) {
      localLogsElement.textContent = 'No local logs recorded yet.';
      return;
    }

    localLogsElement.textContent = logs.map(function(log) {
      return JSON.stringify(log);
    }).join('\n');
  }
</script>
</body>
</html>
